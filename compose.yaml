# Browser Dishylink. No `platform:` and no `build.platforms` — Docker builds
# and runs only the architecture of this host (amd64 or arm64), never both.
# The host must be on the Starlink LAN — dish (192.168.100.1) and router
# (192.168.1.1) are not inside this compose network. Do not set
# network_mode: host on Docker Desktop; that attaches to the Linux VM, not
# the host's Wi-Fi. On native Linux (a Pi on the LAN) published ports + NAT
# are enough if the host can already reach those addresses.
#
# If launchd is already running com.dishylink.historian, stop it first. Two
# recorders double the 200ms router client poll.

services:
  dishylink:
    build:
      context: .
    image: dishylink:local
    ports:
      - "8080:8080"
    volumes:
      - historian-data:/data
      # Persist a pasted starlink.com session across restarts:
      #   touch .starlink-cookie && chmod 600 .starlink-cookie
      # then uncomment:
      # - ./.starlink-cookie:/app/.starlink-cookie
    environment:
      HISTORIAN_DATA_DIR: /data
      # Mac LAN identity so "This device" and pause-self-protect survive Docker
      # Desktop's port publish (the container otherwise sees the VM's NICs).
      # HOST_LAN_IP: 192.168.1.45
      # HOST_MAC: aa:bb:cc:dd:ee:ff
    restart: unless-stopped

volumes:
  historian-data:
