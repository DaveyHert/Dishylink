# Build the native Linux desktop package for Ubuntu/Debian.
name: Linux desktop package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:linux
      - uses: actions/upload-artifact@v4
        with:
          name: dishylink-linux-deb
          path: release/*.deb
          if-no-files-found: error
