# Builds and publishes a draft GitHub Release when a v* tag is pushed. Draft,
# not published: electron-updater ignores drafts, so installed apps see nothing
# until someone clicks "Publish release" on GitHub — that click is the actual
# rollout, on demand, separate from when this workflow runs.
name: Release

on:
  push:
    tags: ["v*"]
  # "Run workflow" button in the Actions tab — publishes whatever's on the
  # selected branch under package.json's current version, without needing a tag.
  workflow_dispatch:

# contents: write is what lets GITHUB_TOKEN create/update a release and upload
# assets to it; the repo's default token permissions are read-only, so this has
# to be declared explicitly.
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: resolve
        name: Resolve the tag and reject one that disagrees with package.json
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::pushed tag $GITHUB_REF_NAME does not match package.json version $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft release unless it already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --notes ""

  release-mac:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both mac archs in one invocation: electron-builder writes a single
      # latest-mac.yml covering arm64 and x64. Two separate jobs would each
      # overwrite the other's yml on the release and strand one arch.
      - run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-win:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-extension:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zip:extension
      - run: npm run zip:extension:firefox
      - run: npm run zip:extension:edge
      - name: Attach the store archives to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" .output/dishylink-*.zip \
            --clobber --repo "$GITHUB_REPOSITORY"
