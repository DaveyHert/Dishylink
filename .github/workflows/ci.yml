# The gate the project did not have: 288 tests and a clean `tsc -b` that nothing
# enforced, so every check depended on a human remembering to run it.
#
# Four jobs rather than one, so a failure names itself in the run list — a red
# "typecheck" reads differently from a red "test", and the difference is the first
# thing you want to know.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # "Run workflow" button in the Actions tab, which is what fires the Windows
  # packaging job below.
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `--max-warnings 0`, so a warning fails the build exactly like an error. The
      # warn severities in eslint.config.js set how a rule reads when you run it by
      # hand; CI tolerates none of them, which is what keeps the tree warning-free.
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The dish and router are not reachable from CI. Everything under test here
      # is pure logic and rendering; nothing dials 192.168.100.1.
      - run: npm test

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits, so a push can be diffed against what it replaced.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only what this push touched, not the whole tree. Prettier arrived long
      # after the code did, so a full check would fail on files nobody edited;
      # this way formatting is enforced going forward and the backlog drains as
      # files are next touched. `npm run format` fixes the whole tree at once.
      - name: Check formatting of changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch reports an all-zero base; nothing to diff against.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit — skipping."
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=ACMR "$base" HEAD \
            -- '*.ts' '*.tsx' '*.mts' '*.mjs' '*.js' '*.json' '*.css' '*.md' || true)
          if [ -z "$changed" ]; then
            echo "No formattable files changed."
            exit 0
          fi
          echo "$changed"
          echo "$changed" | xargs npx prettier --check --ignore-unknown

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:extension
      - run: npm run build:extension
      - run: npm run build:extension:firefox

  # Packages the unsigned Windows installer. Deliberately not run on every push:
  # a Windows runner packaging a ~100 MB Electron app is slow and burns free
  # minutes 2x, and an installer is only wanted when one is being handed out. So
  # it fires only on a manual "Run workflow" — never on PRs or ordinary branch
  # pushes, and a v* tag builds Windows through release.yml instead. The .exe
  # lands as a downloadable run artifact.
  package-win:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: dishylink-windows-installer
          path: release/*.exe
          if-no-files-found: error
