# Unsigned Mac build. The renderer (dist/) and the fully bundled main + preload +
# historian (dist-electron/) are self-contained — every third-party dependency is
# inlined at build time, so no node_modules ships. Signing (Developer ID) is
# deferred to a paid Apple account and is config-only when it lands (PLAN.md phase
# 5); identity:null tells electron-builder to skip signing rather than hunt for a
# certificate and fail.
appId: com.dishboard.dishylink
productName: DishyLink
copyright: © 2026 daveyhert

# Ad-hoc sign the built .app so macOS will post notifications (an unsigned build
# fails the notification call outright). Free, no Apple account — see the hook.
# identity:null below stops electron-builder hunting for a Developer ID cert; the
# hook does the ad-hoc signing afterward with the correct bundle identifier.
afterPack: scripts/afterPack.cjs

directories:
  output: release
  buildResources: build

# Only the built app ships. build/icon.png is named explicitly because main.ts
# loads the tray/dock icon from ../build/icon.png at runtime, so it has to sit
# inside the asar; being the buildResources dir would otherwise keep it out.
# electron-builder bundles production node_modules by default, but vite bundles
# every runtime dependency into dist-electron/, so the dependency tree is dead
# weight in the asar — excluding it drops the package from ~46 MB to ~4 MB.
files:
  - dist/**/*
  - dist-electron/**/*
  - build/icon.png
  - package.json
  - "!node_modules/**/*"

# Two per-arch DMGs rather than one universal build. Without an explicit arch list
# electron-builder packages only the host arch, and an arm64-only app will not
# launch on an Intel Mac at all — Rosetta translates x64 → arm64, never the other
# way. Separate targets beat `arch: [universal]` for two reasons: universal adds an
# @electron/universal merge after per-arch packing, which the afterPack hook above
# would have already ad-hoc signed (signature mismatch at merge time); and the
# Electron framework is ~273 MB of the ~279 MB app, so a universal build roughly
# doubles the download for every user instead of ~120 MB each. Nothing here is
# compiled per-arch — vite inlines every dependency and the tree has no native
# modules — so x64 costs only the x64 Electron download at build time.
mac:
  # Both DMGs name their arch. electron-builder omits the suffix for x64 on its
  # own, which leaves the Intel build as plain DishyLink-<version>.dmg — unlabelled
  # next to an explicit arm64 file, so it reads as the one to grab by default and
  # lands Intel binaries on Apple Silicon machines.
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
  # Prebuilt by scripts/make-icon.mjs, not converted here — electron-builder's own
  # ICNS writer corrupts the 16/32/48 px slices, which is what Finder list views and
  # the Get Info header draw. See that script for the detail.
  icon: build/icon.icns
  category: public.app-category.utilities
  identity: null

# Unsigned Windows build. There is no ad-hoc equivalent to reach for here and none
# is needed: unlike macOS (whose notification API refuses to fire from an unsigned
# app — see afterPack.cjs), Windows posts notifications from unsigned apps fine.
# A code-signing cert is a few hundred a year (PLAN.md's accepted sleeper cost), so
# until that lands the installer is unsigned and Windows SmartScreen shows a one-off
# "unknown publisher" prompt on first run — click through and it installs normally.
win:
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    # nsis is the standard assisted installer .exe. Only x64 — Windows on ARM is a
    # rounding error and the dev/test box is x64.
    - target: nsis
      arch: [x64]
  # The runtime PNG doubles as the packaging icon. electron-builder converts it to a
  # multi-resolution .ico itself; only its *ICNS* writer is the buggy one that forced
  # the prebuilt-icns dance on macOS above — its ICO writer is fine, so no per-format
  # icon script is needed on this side.
  icon: build/icon.png
